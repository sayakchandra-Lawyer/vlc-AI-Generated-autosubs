[project]
name = "vlc-autosubs"
dynamic = ["version"]
description = "Automatic English subtitles for VLC: local Whisper speech translation for ~99 languages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sayak Chandra" }]
requires-python = ">=3.11"
keywords = ["vlc", "subtitles", "whisper", "translation", "speech-to-text", "srt"]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.1",
]

[project.urls]
Homepage = "https://github.com/sayakchandra-Lawyer/vlc-AI-Generated-autosubs"
Issues = "https://github.com/sayakchandra-Lawyer/vlc-AI-Generated-autosubs/issues"

[project.scripts]
vlc-autosubs = "vlc_autosubs.cli:main"

[project.gui-scripts]
# What VLC starts in the background; a windowless launcher on Windows.
vlc-autosubs-helper = "vlc_autosubs.helper:main"

[dependency-groups]
# `uv sync` / `uv run` install these in a checkout. The build commands
# (`uv run autosubs-build`, `uv run autosubs-reproduce`) come from devtools/.
dev = [
    "pytest>=8",
    "autosubs-devtools",
]

[tool.uv.workspace]
members = ["devtools"]

[tool.uv.sources]
autosubs-devtools = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vlc_autosubs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vlc_autosubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
