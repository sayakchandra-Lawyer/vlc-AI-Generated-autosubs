name: Release

# Push a tag like v1.1.0 to build every download and publish a GitHub release.
# "Run workflow" on the Actions tab builds them without releasing (for testing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc, so the Linux build runs on more distros.
        # macos-14 runners are Apple Silicon; Intel Macs can use the uv install.
        os: [windows-latest, macos-14, ubuntu-22.04]
        model: ["", "small"]   # "" = standard build, "small" = offline build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # The build tasks below are `uv run` commands from devtools/, so each
      # can be run and tested locally too.
      - name: Check the tag matches the version and has release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: uv run --locked autosubs-release-notes "$GITHUB_REF_NAME"

      - run: uv run --locked pytest

      - name: Build
        shell: bash
        run: uv run --locked autosubs-build ${{ matrix.model && format('--bundle-model {0}', matrix.model) || '' }}

      - name: Smoke-test the build
        shell: bash
        run: uv run --locked autosubs-smoke-test dist/vlc-autosubs-*

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.model || 'standard' }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload the downloads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: uv run --locked autosubs-release-notes "$GITHUB_REF_NAME" --output notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: AutoSubs ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
